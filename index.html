<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookieLab</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <h1>CookieLab 🍪</h1>
        <p id="saludo"></p>

        <!-- Elementos para la Fase 3 -->
        <section id="preferencias" style="margin-top: 20px;">
            <label for="select-tema">Tema:</label>
            <select id="select-tema">
                <option value="claro">Claro</option>
                <option value="oscuro">Oscuro</option>
            </select>

            <label for="select-idioma" style="margin-left: 10px;">Idioma:</label>
            <select id="select-idioma">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </section>

        <!-- Elementos para la Fase 5 -->
        <section id="panel-control" style="margin-top: 20px;">
            <button id="btn-cambiar">Cambiar mi nombre</button>
            <button id="btn-olvidar">Olvidarme</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
